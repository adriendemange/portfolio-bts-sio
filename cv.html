<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon CV - Portfolio Adrien D.</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .cv-content {
            max-width: 1000px;
            margin: 100px auto;
            padding: 2rem;
            background: var(--color-bg-secondary);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            text-align: center;
        }

        h1 {
            color: var(--color-accent-primary);
            margin-bottom: 2rem;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 2rem;
            color: var(--color-accent-primary);
            text-decoration: none;
            font-family: var(--font-mono);
            text-align: left;
            width: 100%;
        }

        .back-btn:hover {
            text-decoration: underline;
        }
        
        .cv-container {
            width: 100%;
            height: 80vh;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            overflow: hidden;
            background-color: var(--color-bg-primary);
        }
        
        .download-action {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="cv-content">
            <a href="index.html" class="back-btn">← Retour au portfolio</a>

            <h1>Mon Curriculum Vitae</h1>

            <div class="cv-container">
                <iframe src="CV_Adrien_Ecole.pdf" width="100%" height="100%" style="border: none;">
                    Votre navigateur ne supporte pas l'affichage des PDF. <a href="CV_Adrien_Ecole.pdf">Télécharger le CV</a>.
                </iframe>
            </div>
            
            <div class="download-action">
                <a href="CV_Adrien_Ecole.pdf" download class="btn btn-primary">Télécharger mon CV</a>
            </div>
        </div>
    </div>

</body>

</html>
